# Local MongoDB config for the pos project (single-node replica set for transaction support)
storage:
  dbPath: E:\pos\mongodb-data
  wiredTiger:
    engineConfig:
      # Default cache sizing is based on TOTAL installed RAM (~3.5GB on this 8GB
      # machine), not what's actually free — that mismatch caused repeated
      # fatal out-of-memory crashes. Capped to the WiredTiger minimum, which is
      # plenty for this project's small dataset.
      cacheSizeGB: 0.25

systemLog:
  destination: file
  logAppend: true
  path: E:\pos\mongodb-data\log\mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1

replication:
  replSetName: rs0
